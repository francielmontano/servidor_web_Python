[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-api"
version = "1.0.0"
authors = [
    { name="Franciel M.A.", email="francieldemontano89@gmail.com" }
]
description = "Un framework web ligero e inteligente construido desde cero en Python"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

# Eliminamos la sección [tool.setuptools.packages.find] para evitar conflictos

